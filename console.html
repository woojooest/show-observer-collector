<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>演出数据采集控制台</title>
<link rel="stylesheet" href="console.css">

<header class="bar">
  <div>
    <strong>演出观察</strong><span class="sub">采集控制台</span>
    <span id="status" class="chip push">未登录</span>
  </div>
</header>

<main>
  <div id="paused" class="banner warn" hidden></div>
  <button id="resume" class="btn" hidden>已重新登录大麦，恢复采集</button>
  <div id="expired" class="banner warn" hidden>登录已失效，请在下面重新登录。自动采集已暂停；已采到的数据存在本地，重新登录后可以上传。</div>
  <div id="expiring" class="banner" hidden></div>

  <div class="grid">
    <section class="card">
      <h2>账号</h2>

      <div id="signed-in" hidden>
        <div class="who">
          <div class="avatar" id="avatar" aria-hidden="true"></div>
          <div>
            <div class="row"><strong id="who"></strong><span id="role" class="chip"></span></div>
            <div class="sub" id="until"></div>
          </div>
        </div>
        <dl class="facts">
          <dt>服务器</dt><dd id="server"></dd>
          <dt>任务来源</dt><dd id="scope"></dd>
        </dl>
        <div class="row">
          <button id="logout" class="btn danger">退出这台设备</button>
        </div>
      </div>

      <form id="login">
        <label>观察系统地址<input id="observer" type="url" required spellcheck="false" placeholder="https://你的服务器地址"></label>
        <label>用户名<input id="username" autocomplete="username" required></label>
        <label>密码<input id="password" type="password" autocomplete="current-password" required></label>
        <label id="code-row" hidden>验证码<input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="验证器 App 上的 6 位数字"></label>
        <div class="row">
          <button type="submit" class="btn primary" id="login-btn">登录这台设备</button>
          <span id="login-msg" class="sub"></span>
        </div>
        <details>
          <summary>使用令牌登录</summary>
          <p class="sub">给手动生成的令牌或服务器的 OBSERVER_TOKEN 用。一般不需要。</p>
          <div class="row">
            <input id="token" type="password" autocomplete="off" placeholder="soa_… 或 OBSERVER_TOKEN">
            <button type="button" class="btn" id="save-token">保存令牌</button>
          </div>
        </details>
      </form>
    </section>

    <section class="card">
      <h2>设置</h2>
      <form id="settings">
        <fieldset>
          <legend>采到的数据</legend>
          <label class="choice"><input type="radio" name="upload" value="server"> 【默认】立即上传到观察系统（连不上时先存本地）</label>
          <label class="choice"><input type="radio" name="upload" value="local"> 先存在本地，稍后选择上传或导出</label>
        </fieldset>
        <label class="choice"><input id="auto" type="checkbox"> 自动执行：开演前 1 天读取排期，开演前 2 小时采集库存</label>
        <!-- <p class="sub">关闭时只按你的选择执行。访问大麦时每一步间隔 2–4 秒，失败最多重试一次，遇到登录或验证页即暂停。</p> -->
        <div class="row"><button type="submit" class="btn">保存设置</button><span id="saved" class="sub"></span></div>
      </form>
    </section>
  </div>

  <section class="card">
    <div class="row">
      <h2>待办</h2>
      <button id="sync" class="btn">同步待办</button>
      <span id="synced" class="sub"></span>
    </div>
    <h3>需要读取完整排期</h3>
    <table><thead><tr><th><input type="checkbox" data-all="projects" aria-label="全选排期"></th><th>剧目</th><th>原因</th></tr></thead>
      <tbody id="projects"></tbody></table>
    <h3>场次售票信息</h3>
    <table><thead><tr><th><input type="checkbox" data-all="sessions" aria-label="全选场次"></th><th>开演</th><th>剧目</th><th>剧场</th><th>建议采集</th><th>状态</th></tr></thead>
      <tbody id="sessions"></tbody></table>
    <div class="row">
      <button id="run-picked" class="btn primary">执行选中</button>
      <button id="run-all" class="btn">全部执行</button>
      <span id="running" class="sub"></span>
    </div>
  </section>

  <div class="grid">
    <section class="card">
      <div class="row">
        <h2>本地数据</h2>
        <span id="outbox-count" class="sub"></span>
        <span class="push"></span>
        <button id="upload" class="btn">全部上传</button>
        <button id="export" class="btn">导出 JSON</button>
      </div>
      <ul id="outbox" class="list"></ul>
    </section>

    <section class="card">
      <h2>日志</h2>
      <ul id="events" class="list"></ul>
    </section>
  </div>
</main>
<script src="config.js"></script>
<script src="console.js"></script>
</html>
